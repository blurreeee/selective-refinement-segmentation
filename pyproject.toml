[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-seg"
version = "0.1.0"
description = "Three-action selective segmentation with damage-aware outcome prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "transformers==4.57.1", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
selective-seg = "selective_seg.cli:main"

[tool.setuptools.packages.find]
include = ["selective_seg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
